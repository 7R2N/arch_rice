# ─────────────────────────────────────────────────────────────
#  kitty.conf
# ─────────────────────────────────────────────────────────────

include ~/.cache/wal/colors-kitty.conf

# ── Font ─────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# nicer box-drawing / powerline joins
disable_ligatures cursor

# ── Cursor ───────────────────────────────────────────────────
cursor_shape           beam
cursor_blink_interval  0

# ── Scrollback ───────────────────────────────────────────────
scrollback_lines            20000
scrollback_pager            nvim -u NONE -c "set nonumber norelativenumber nolist showtabline=0 foldcolumn=0 laststatus=0" -c "autocmd TermOpen * normal G" -c "silent write! $XDG_RUNTIME_DIR/kitty_scrollback" -c "terminal cat $XDG_RUNTIME_DIR/kitty_scrollback - "
scrollback_pager_history_size 10
wheel_scroll_multiplier     3.0

# ── Mouse ────────────────────────────────────────────────────
copy_on_select        clipboard
strip_trailing_spaces smart
mouse_hide_wait       2.0
url_style             curly
detect_urls           yes
show_hyperlink_targets yes

# ── Performance ──────────────────────────────────────────────
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# ── Bell ─────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes

# ── Window ───────────────────────────────────────────────────
remember_window_size  no
initial_window_width  110c
initial_window_height 30c
window_padding_width  8
confirm_os_window_close 0
background_opacity         0.5
dynamic_background_opacity yes

enabled_layouts stack

# ── Tab bar: hidden, you use Hyprland windows ────────────────
tab_bar_style hidden

# ── Shell integration (gives kitty the cwd + prompt marks) ───
shell_integration enabled

# ── Remote control (lets nvim / scripts drive kitty) ─────────
allow_remote_control yes
listen_on unix:@kitty-{kitty_pid}

# ─────────────────────────────────────────────────────────────
#  KEYBINDS
# ─────────────────────────────────────────────────────────────

# ── New windows — always inherit the current directory ───────
map ctrl+shift+enter new_os_window_with_cwd
map ctrl+shift+n     new_os_window_with_cwd
map ctrl+shift+w     close_os_window

# ── Hints: grab things off the screen ────────────────────────
# open a file path seen in the output, in nvim
map ctrl+shift+f kitten hints --type path --program "launch --type=overlay nvim"
# copy a path to clipboard
map ctrl+shift+p>p kitten hints --type path --program @
# open a URL
map ctrl+shift+e kitten hints --type url
# copy a line
map ctrl+shift+p>l kitten hints --type line --program @
# copy a word / hash / git sha
map ctrl+shift+p>w kitten hints --type word --program @
map ctrl+shift+p>h kitten hints --type hash --program @

# ── Scrollback ───────────────────────────────────────────────
map ctrl+shift+h show_scrollback
# scroll to previous/next shell prompt (needs shell integration)
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1
# dump output of the last command into nvim
map ctrl+shift+g show_last_command_output

# ── Font size ────────────────────────────────────────────────
map ctrl+equal      change_font_size all +1.0
map ctrl+minus      change_font_size all -1.0
map ctrl+0          change_font_size all 0

# ── Opacity ──────────────────────────────────────────────────
map ctrl+alt+equal set_background_opacity +0.05
map ctrl+alt+minus set_background_opacity -0.05
map ctrl+alt+0     set_background_opacity default
map ctrl+alt+1     set_background_opacity 1.0

# ── Misc ─────────────────────────────────────────────────────
map ctrl+shift+u kitten unicode_input
map ctrl+shift+F5 load_config_file
map ctrl+shift+delete clear_terminal reset active
