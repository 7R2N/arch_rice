#######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################


# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf
source = /home/trzn/.config/hypr/conf.d/my_programs.conf
source = /home/trzn/.config/hypr/conf.d/keybinds.conf
source = /home/trzn/.config/hypr/conf.d/touchscreen.conf
source = /home/trzn/.config/hypr/conf.d/touchpad.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# Explicit, deterministic layout: laptop on the left, AOC external on the right.
monitor = eDP-1, 1920x1200@60, 0x0, 1
monitor = desc:AOC Q27P3C, 2560x1440@59.95, 1920x0, 1
# TV on the same HDMI port maxes out at 1080p
monitor = desc:Philips Consumer Electronics Company PHILIPS FTV, 1920x1080@60, 1920x0, 1
# Fallback for any other monitor that gets plugged in
monitor = , preferred, auto, 1

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = $terminal
#exec-once = nm-applet
exec-once = hyprctl dispatch exec "[workspace 2 silent] firefox"
exec-once = awww-daemon
exec-once = hypridle & hyprlock
exec-once = spotify
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,xdgdesktopportal   # Qt apps follow the system dark preference via the desktop portal
env = ELECTRON_OZONE_PLATFORM_HINT,auto   # Electron apps (Spotify, Discord, Signal) run native Wayland

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 8

    border_size = 3

    # Samurai theme — light top-left to dark bottom-right
    col.active_border = rgba(6F5F40ee) rgba(8B764Edd) rgba(776644cc) rgba(958c77bb) 135deg
    col.inactive_border = rgba(958c7788) rgba(0E0D0D55) 135deg

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 12
    rounding_power = 2

    # Slight transparency on unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000040)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 2

        vibrancy = 0.2
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = linear,         0,    0,    1,    1

    # 侍 Samurai curves
    bezier = iaido,          0.05, 0.7,  0.1,  1       # sudden draw — explosive start, clean stop
    bezier = zanshin,        0.22, 1.1,  0.36, 1       # follow-through — slight overshoot, composed settle
    bezier = noto,           0.33, 0,    0.1,  1       # return to stance — measured, grounded
    bezier = kiri,           0,    0.85, 0.15, 1       # the cut itself — near-instant, decisive

    # 斬 Animations
    #           NAME,          ONOFF, SPEED, CURVE,    [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     6,     zanshin
    animation = windows,       1,     5,     iaido
    animation = windowsIn,     1,     3.5,   kiri,     popin 80%
    animation = windowsOut,    1,     2.5,   noto,     popin 70%
    # resize/relayout — quick and overshoot-free so the on-screen keyboard's
    # 400px reflow doesn't throw every window across the screen.
    # Change the 1 to a 0 for a fully instant snap.
    animation = windowsMove,   1,     2,     kiri
    animation = fadeIn,        1,     2.5,   kiri
    animation = fadeOut,       1,     3,     noto
    animation = fade,          1,     3,     iaido
    animation = layers,        1,     3.5,   iaido
    animation = layersIn,      1,     2.5,   kiri,     fade
    animation = layersOut,     1,     2,     noto,     fade
    animation = fadeLayersIn,  1,     2,     kiri
    animation = fadeLayersOut, 1,     2.5,   noto
    animation = workspaces,    1,     3.5,   iaido,    slidefade 30%
    animation = workspacesIn,  1,     3,     kiri,     slidefade 25%
    animation = workspacesOut, 1,     4.5,   noto,     slidefade 60%
    animation = zoomFactor,    1,     5,     zanshin
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# Per-monitor workspaces: laptop (eDP-1) owns 1-5, AOC (HDMI-A-1) owns 6-10.
# Each monitor's workspaces are independent — switching one never affects the other.
workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:HDMI-A-1, default:true
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
cursor {
    inactive_timeout = 5   # hide the pointer after 5s of no movement
}

misc {
    # awww-daemon handles wallpapers — no need for the built-in logo/background
    force_default_wallpaper = 0
    disable_hyprland_logo = true

    # Wake the screen from dpms-off on any input
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = spotify-special
    match:class = (?i)spotify
    workspace = special:spotify
    float = yes
    center = true
}

# Float file-picker / portal dialogs instead of tiling them
windowrule {
    name = float-portal-dialogs
    match:class = ^(xdg-desktop-portal-gtk)$

    float = yes
    center = true
}

windowrule {
    name = float-common-dialogs
    match:title = ^(Open File|Open Folder|Save File|Save As|File Upload|Select a File|Choose Files)(.*)$

    float = yes
    center = true
}

# Firefox Picture-in-Picture: floating, pinned on top across workspaces
windowrule {
    name = firefox-pip
    match:title = ^(Picture-in-Picture)$

    float = yes
    pin = yes
    keep_aspect_ratio = yes
    size = 640 360
    move = 100%-w-40 100%-h-40
}

# Wofi: don't animate the layer surface — it resizes on every keystroke as the
# result list shrinks, and animating that reads as the menu jumping around.
layerrule = noanim, wofi

# On-screen keyboard (squeekboard). Its layer claims a 400px exclusive zone, so
# every tiled window is resized when it appears. That reflow is unavoidable —
# Hyprland has no rule to override an exclusive zone, and the shrink is what
# keeps the keyboard from covering the field you're typing into. What we can do
# is stop it being *animated*: noanim kills the keyboard's own slide, and the
# windowsMove override below makes the reflow near-instant instead of a 0.5s
# overshooting slide with every other window along for the ride.
layerrule = noanim, osk
