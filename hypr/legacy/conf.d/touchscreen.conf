############################
### TOUCHSCREEN GESTURES ###
############################

# Uses lisgd — a lightweight touchscreen gesture daemon
# Device: Wacom HID 52C6 Finger (/dev/input/event9)
#
# Gestures:
#   3-finger swipe left/right → switch workspace
#   3-finger swipe up         → maximize (fullscreen)
#   3-finger swipe down       → toggle floating
#   4-finger swipe down       → close window
#
# Note: the event device number may change after reboot.
# The exec-once below uses a script that auto-detects the device.

exec-once = /home/trzn/.config/hypr/conf.d/lisgd-start.sh

# Tablet mode: watch the Yoga fold switch — in tablet mode squeekboard runs and
# auto-shows the on-screen keyboard when a text field is focused
#
# REQUIRES a D-Bus activation file outside this repo (squeekboard ships only a
# static systemd unit meant for gnome-session, so nothing starts it here):
#   ~/.local/share/dbus-1/services/sm.puri.OSK0.service
#     [D-BUS Service]
#     Name=sm.puri.OSK0
#     Exec=/usr/bin/squeekboard
#     SystemdService=mobi.phosh.OSK.service
# Without it the busctl calls in the scripts below silently do nothing.
exec-once = /home/trzn/.config/hypr/scripts/tablet-mode-watch.sh
