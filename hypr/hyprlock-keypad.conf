# ═══════════════════════════════════════════════════════════
# HYPRLOCK — touch PIN pad (tablet mode fallback)
# Sourced from hyprlock.conf AFTER hyprlock-theme.conf (uses its $vars).
#
# Each key is a tappable shape whose onclick injects the digit with wtype
# (zwp_virtual_keyboard). Hyprland routes the injected keys to the lock
# surface, and the patched hyprlock auto-submits once the PIN length
# (/etc/hyprlock-pin.len) is reached. ⌫ = BackSpace, ⏎ = Return (for the
# full password). Labels carry no onclick, otherwise taps would fire twice.
# Generated by a one-off script; edit positions freely.
# ═══════════════════════════════════════════════════════════

shape {
    monitor =
    size = 104, 84
    color = $bg
    rounding = 12
    border_size = 2
    border_color = $accent1
    position = -116, -120
    halign = center
    valign = center
    zindex = 1
    onclick = /home/trzn/.local/bin/wtype 1
}
label {
    monitor =
    text = 1
    color = $fg
    font_size = 28
    font_family = $font
    position = -116, -120
    halign = center
    valign = center
    zindex = 2
}

